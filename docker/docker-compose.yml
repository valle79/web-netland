services:
  db:
    image: postgres:16-alpine
    container_name: netland-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netland
      POSTGRES_PASSWORD: netland_dev_password
      POSTGRES_DB: netland
    ports:
      - "5432:5432"
    volumes:
      - netland_pgdata:/var/lib/postgresql/data

volumes:
  netland_pgdata: